<!DOCTYPE html>

    <link rel="stylesheet" href="css/style.css">

  <!-- ========= BODY ========= -->

    <!-- ---------- Header ---------- -->

      <nav class="nav">
        <a href="#home" class="nav-logo" aria-label="span home">

      <!-- ---- HERO ---- -->
      <section class="hero" id="home">
        <div class="container hero-grid">
          <div class="reveal in">
            <span class="eyebrow" data-i18n="hero.title"></span>

            <h1>
              <span data-i18n="hero.subtitle_part1"></span>
              <span><br></span>
              <span data-i18n="hero.subtitle_part2"></span>

              <span data-i18n="hero.subtitle_part4"></span>
            </h1>

            <p class="hero-sub">

              <span data-i18n="hero.text_part2"></span>
            </p>
          
            <div class="hero-actions">
              <a href="#approach" class="btn btn-primary" data-i18n="hero.button1"></a>
              <a href="#contact" class="btn btn-ghost" data-i18n="hero.button2"></a>
            </div>
          </div>

          <div class="hero-visual">
            <svg viewBox="-50 0 680 420" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 150%; max-width: 900px; height: auto;">
              <defs>
                <linearGradient id="edgeGrad" x1="-20" y1="0" x2="650" y2="420">
                  <stop offset="0%" stop-color="#0B2D5C"/>
                  <stop offset="50%" stop-color="#1AA7A1"/>
                  <stop offset="100%" stop-color="#74C365"/>
                </linearGradient>
              </defs>
              <g stroke="url(#edgeGrad)" stroke-width="1.4" opacity="0.55">
                <path class="edge" d="M40 300 Q120 120 260 150"/>
                <path class="edge" d="M260 150 Q340 80 430 110"/>
                <path class="edge" d="M430 110 Q510 140 560 220"/>
                <path class="edge" d="M40 300 Q160 340 260 150" opacity="0.4"/>
                <path class="edge" d="M260 150 Q300 260 430 110" opacity="0.4"/>
                <path class="edge" d="M120 120 Q220 60 260 150" opacity="0.5"/>
              </g>
              <g>
                <circle class="node" cx="40" cy="300" r="7" fill="#0B2D5C"/>
                <circle class="node" cx="120" cy="120" r="5" fill="#12628F"/>
                <circle class="node" cx="260" cy="150" r="10" fill="#1AA7A1"/>
                <circle class="node" cx="430" cy="110" r="6" fill="#3AAE7E"/>
                <circle class="node" cx="560" cy="220" r="8" fill="#74C365"/>
                <circle class="node" cx="195" cy="260" r="4" fill="#57BA6E" opacity="0.7"/>
              </g>
            </svg>        
          </div>      
        </div>
      </section>

      <!-- ---- divider ---- -->
      <div class="divider">
        <svg viewBox="0 0 1200 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 30 Q 300 5 600 30 T 1200 30" stroke="#1AA7A1" stroke-width="1" fill="none" stroke-dasharray="4 6"/>
        </svg>
      </div>
      
      <!-- ---- SECTION: WHY ---- -->
      <section class="section-pad why" id="why">
      
        <div class="container why-inner reveal">
          <span class="eyebrow" data-i18n="why.title"></span>
          <h2 data-i18n="why.subtitle1"></h2>
          <p data-i18n="why.text1_part1"></p>
          <p></p>    
          <p>
            <blockquote class="pain-quote" data-i18n="why.text1_part2"></blockquote>
            <blockquote class="pain-quote" style="color: #1AA7A1;" data-i18n="why.text1_part3"></blockquote>
            <blockquote class="pain-quote" data-i18n="why.text1_part4"></blockquote>
            <blockquote class="pain-quote" style="color: #1AA7A1;" data-i18n="why.text1_part5"></blockquote>
            <blockquote class="pain-quote" data-i18n="why.text1_part6"></blockquote>
            <blockquote class="pain-quote" style="color: #1AA7A1;" data-i18n="why.text1_part7"></blockquote>
            <blockquote class="pain-quote" data-i18n="why.text1_part8"></blockquote>
          </p>
          <p></p>  
          <p data-i18n="why.text1_part9"></p>
          <p data-i18n="why.text1_part10"></p>
          <p>
            <ul>
              <li data-i18n="why.text1_part11"></li>
              <li data-i18n="why.text1_part12"></li>
              <li data-i18n="why.text1_part13"></li>
              <li data-i18n="why.text1_part14"></li>
              <li data-i18n="why.text1_part15"></li>
            </ul> 
          </p>
          <p><br></p>
        </div>
        
        <div class="container why-inner reveal">  
          <h2 class="section-title" data-i18n="why.subtitle2"></h2>
          <p> 
            <span class="highlight" data-i18n="why.text2_part1"></span>
            <span data-i18n="why.text2_part2"></span>
          </p>
        </div>
          
        <div class="container">
          <div class="triad">
            <div class="triad-line"></div>
            <div class="triad-card reveal">
              <div class="triad-dot" style="background:var(--navy)"></div>
              <h3 data-i18n="why.card1_title"></h3>
              <p data-i18n="why.card1_text"></p>
            </div>
            <div class="triad-card reveal">
              <div class="triad-dot" style="background:var(--turquoise)"></div>
              <h3 data-i18n="why.card2_title"></h3>
              <p data-i18n="why.card2_text"></p>
            </div>
            <div class="triad-card reveal">
              <div class="triad-dot" style="background:var(--green)"></div>
              <h3 data-i18n="why.card3_title"></h3>
              <p data-i18n="why.card3_text"></p>
            </div>
          </div>        
        </div>      
      </section>
      
      <!-- ---- SECTION: APPROACH ---- -->
      <section class="section-pad" id="approach" style="background:var(--bg-alt)">
        <div class="container">

          <div class="section-head reveal">
            <span class="eyebrow" data-i18n="approach.title"></span>
            
            <div class="container">
              <div class="systhinking-grid">
                <img src="images/icon_square_bridge_fr.svg" alt="Icon bridge" class="icon-fr">
                <img src="images/icon_square_bridge_en.svg" alt="Icon bridge" class="icon-en">        
                
                <img src="images/icon_square_disciplines_fr.svg" alt="Icon disciplines" class="icon-fr">      
                <img src="images/icon_square_disciplines_en.svg" alt="Icon disciplines" class="icon-en">
                
                <img src="images/icon_square_cycle_fr.svg" alt="Icon cycle" class="icon-fr">      
                <img src="images/icon_square_cycle_en.svg" alt="Icon cycle" class="icon-en">      
                
                <img src="images/icon_square_vision_fr.svg" alt="Icon vision" class="icon-fr"> 
                <img src="images/icon_square_vision_en.svg" alt="Icon vision" class="icon-en">                 
                
              </div>
            </div>  

            <h2><br></h2>
            <h2 class="section-title" data-i18n="approach.subtitle"></h2>
            
            <p class="section-sub">
              <span data-i18n="approach.text1_part1"></span>
              <span><br><br></span>
              <span class="highlight" data-i18n="approach.text1_part2"></span>
              <span data-i18n="approach.text1_part3"></span>
            </p>
          </div>
          
          <div class="container">      
            <div class="network-layout reveal">
              <div class="network-desc" id="netDesc">                      
                <h4 class="node-subtitle" data-i18n="approach.network_intro1"></h4>                 
                
                <div class="node-block" data-block="1">
                  <h5 class="node-texttitle" data-i18n="approach.network_intro2"></h5>
                  <ul class="node-textitems"></ul>
                </div>           

                <div class="node-block" data-block="2">
                  <h5 class="node-texttitle"></h5>
                  <ul class="node-textitems"></ul>
                </div>  
              </div>  

              <div class="network-canvas">  
                <svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg">
                                
                  <g stroke="#C9D6E3" stroke-width="1.4" fill="none">
                    <line class="net-line" x1="260" y1="210" x2="112.5" y2="112.5"/>              
                    <line class="net-line" x1="260" y1="210" x2="407.5" y2="112.5"/>              
                    <line class="net-line" x1="260" y1="210" x2="407.2" y2="337.5"/>              
                    <line class="net-line" x1="260" y1="210" x2="112.5" y2="337.5"/>        
                  </g>

                  <g 
                    class="net-node" 
                    tabindex="0" 
                    data-i18n-attr="
                      data-subtitle:approach.node1_subtitle;
                      data-text1title:approach.node1_text1_title;
                      data-text2title:approach.node1_text2_title;
                    "
                    data-i18n-list1="approach.node1_text1_items"
                    data-i18n-list2="approach.node1_text2_items"
                  >
                    <circle cx="112.5" cy="112.5" r="16" fill="#0B2D5C"/>
                    <text x="112.5" y="80" text-anchor="middle" font-size="12" fill="#14213D" data-i18n="approach.node1_title"></text>
                  </g>  

                  <g 
                    class="net-node" 
                    tabindex="0" 
                    data-i18n-attr="
                      data-subtitle:approach.node2_subtitle;
                      data-text1title:approach.node2_text1_title;
                      data-text2title:approach.node2_text2_title;
                    "
                    data-i18n-list1="approach.node2_text1_items"
                    data-i18n-list2="approach.node2_text2_items"
                  >
                    <circle cx="407.5" cy="112.5" r="16" fill="#166E86"/>
                    <text x="407.5" y="80" text-anchor="middle" font-size="12" fill="#14213D" data-i18n="approach.node2_title"></text>
                  </g>

                  <g 
                    class="net-node" 
                    tabindex="0" 
                    data-i18n-attr="
                      data-subtitle:approach.node3_subtitle;
                      data-text1title:approach.node3_text1_title;
                      data-text2title:approach.node3_text2_title;
                    "
                    data-i18n-list1="approach.node3_text1_items"
                    data-i18n-list2="approach.node3_text2_items"
                  >
                    <circle cx="407.5" cy="337.5" r="16" fill="#3CAE7E"/>
                    <text x="407.5" y="380" text-anchor="middle" font-size="12" fill="#14213D" data-i18n="approach.node3_title"></text>
                  </g>

                  <g 
                    class="net-node" 
                    tabindex="0" 
                    data-i18n-attr="
                      data-subtitle:approach.node4_subtitle;
                      data-text1title:approach.node4_text1_title;
                      data-text2title:approach.node4_text2_title;
                    "
                    data-i18n-list1="approach.node4_text1_items"
                    data-i18n-list2="approach.node4_text2_items"
                  >
                    <circle cx="112.5" cy="337.5" r="16" fill="#74C365"/>
                    <text x="112.5" y="380" text-anchor="middle" font-size="12" fill="#14213D" data-i18n="approach.node4_title"></text>
                  </g>

                  <circle cx="260" cy="210" r="26" fill="#0B2D5C"/>
                  <text x="260" y="215" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" data-i18n="approach.nodecenter_title"></text>                

                </svg>
              </div>      
            </div>  
          </div>

        </div>
      </section>

      <!-- ---- SECTION: ABOUT ---- -->
      <section class="section-pad" id="about">
        <div class="container about-grid">
          <div class="about-photo reveal">
            <svg viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
              <g stroke="rgba(255,255,255,0.35)" stroke-width="1" fill="none">
                <line x1="80" y1="120" x2="200" y2="200"/>
                <line x1="200" y1="200" x2="320" y2="140"/>
                <line x1="200" y1="200" x2="150" y2="330"/>
                <line x1="200" y1="200" x2="280" y2="360"/>
                <line x1="150" y1="330" x2="280" y2="360"/>
                <line x1="320" y1="140" x2="590" y2="170"/>
              </g>
              <circle cx="80" cy="120" r="6" fill="#74C365"/>
              <circle cx="320" cy="140" r="6" fill="#1AA7A1"/>
              <circle cx="200" cy="200" r="9" fill="#fff"/>
              <circle cx="150" cy="330" r="6" fill="#1AA7A1"/>
              <circle cx="280" cy="360" r="6" fill="#74C365"/>
              <circle cx="590" cy="170" r="6" fill="#F1F5F9"/>
            </svg> 
            <img src="images/about_photo.png" alt="Photo Span">
          </div>

          <div class="about-text reveal">
            <span class="eyebrow" data-i18n="about.title"></span>
            <h2 data-i18n="about.subtitle"></h2>
            <p data-i18n="about.text_part1"></p>
            <p>
              <span data-i18n="about.text_part2a"></span> 
              <span class="highlight" data-i18n="about.text_part2b"></span>
              <span data-i18n="about.text_part2c"></span> 
            </p>  
            <p data-i18n="about.text_part3"></p>
            <p data-i18n="about.text_part4"></p>
            <p><br></p>
            <p>            
              <span class="highlight2" data-i18n="about.sign_part1a"></span>
              <span data-i18n="about.sign_part1b"></span>
              <span><br></span>
              <span data-i18n="about.sign_part1c"></span>
            </p>
            <p><br></p>  
            <p>            
              <span class="highlight3" data-i18n="about.val_part1a"></span>
              <span data-i18n="about.val_part1b"></span>
            </p>         
          </div>
        </div>

      <!-- ---- SECTION: For whom ---- -->
      <section class="section-pad whom" id="whom">
        <div class="container whom-inner reveal">
          <span class="eyebrow" data-i18n="whom.title"></span>
          <p data-i18n="whom.text_part1"></p>
          <p>
            <span class="highlight3" data-i18n="whom.text_part2a"></span>

          <p>
            <span class="highlight3" data-i18n="whom.text_part5a"></span>
            <span data-i18n="whom.text_part5b"></span>
          </p>
        </div>
      </section>
        
      <!-- ---- CTA ---- -->
      <section class="cta-band" id="contact">
        <div class="container reveal">
          <h2 data-i18n="cta.title"></h2>
          <p1>
            <span data-i18n="cta.subtitle_part1a"></span>
            <span class="highlight" data-i18n="cta.subtitle_part1b"></span>
            <span data-i18n="cta.subtitle_part1c"></span>
          </p1>
          <p1><br><br><br></p1>
          
          <div class="cycle-wrap reveal">
            <div class="cycle-track">
              <div class="cycle-step"><span class="num">01</span><div class="cycle-dot"></div><span class="label"><span style="font-weight:bold;" data-i18n="cta.act_step1"></span></span></div>
              <div class="cycle-step"><span class="num">02</span><div class="cycle-dot"></div><span class="label"><span style="font-weight:bold;" data-i18n="cta.act_step2"></span></span></div>
              <div class="cycle-step"><span class="num">03</span><div class="cycle-dot"></div><span class="label"><span style="font-weight:bold;" data-i18n="cta.act_step3"></span></span></div>
              <div class="cycle-step"><span class="num">04</span><div class="cycle-dot"></div><span class="label"><span style="font-weight:bold;" data-i18n="cta.act_step4"></span></span></div>	  
            </div>      
          </div>
          
          <div class="container cta-grid">
            <div class="cta-grid-contact reveal">
              <p>    
                <span class="highlight2" data-i18n="contact.name"></span>
              </p>
              <p><a href="mailto:spansys.consulting@gmail.com" data-i18n="contact.email"></a></p>
              <p><a href="https://www.linkedin.com/in/jennifer-oudry" target="_blank" rel="noopener noreferrer" data-i18n="contact.linkedin"></a></p>
              <p> </p>	  	       
            </div>
          </div>     
          
        </div>
